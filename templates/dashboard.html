<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyers Dom Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        .bid-row:hover, .ask-row:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .depth-bar {
            position: absolute;
            top: 0;
            height: 100%;
            background-color: rgba(0, 255, 0, 0.1);
            z-index: 1;
            transition: width 0.3s ease-in-out;
        }
        .ask-depth-bar {
            background-color: rgba(255, 0, 0, 0.1);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table td, .table th { position: relative; z-index: 2; }
    </style>
</head>
<body class="bg-base-200 min-h-screen" data-theme="dark">
    <div class="navbar bg-base-100 shadow-md sticky top-0 z-50">
        <div class="flex-1">
            <a class="btn btn-ghost normal-case text-xl">
                <span class="text-primary font-bold">FYERS</span><span> DOM</span>
                <span class="text-xs ml-2 badge badge-primary badge-outline badge-sm">ANALYZER</span>
            </a>
        </div>
        <div class="flex-none gap-2">
            <a href="/auth/logout" class="btn btn-sm btn-outline btn-error">Logout</a>
        </div>
    </div>

    <div class="container mx-auto px-4 py-4">
        <div role="tablist" class="tabs tabs-lifted" id="instrument-tabs">
            <!-- Tabs will be dynamically inserted here -->
        </div>
        <div id="instrument-tab-content" class="mt-[-1px]">
            <!-- Tab content will be dynamically inserted here -->
        </div>
    </div>

    <template id="instrument-tab-template">
        <div class="tab-content p-4 bg-base-100 rounded-b-box rounded-tr-box">
            <!-- Header Section -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-4">
                <div class="card bg-base-200 shadow">
                    <div class="card-body p-4">
                        <div class="stat-title text-xs">Symbol</div>
                        <div class="stat-value text-md font-mono symbol-display"></div>
                    </div>
                </div>
                <div class="card bg-base-200 shadow">
                    <div class="card-body p-4">
                        <div class="stat-title text-xs">Last Price</div>
                        <div class="stat-value text-md font-mono last-price">--</div>
                    </div>
                </div>
                <div class="card bg-base-200 shadow">
                    <div class="card-body p-4">
                        <div class="stat-title text-xs">Bid-Ask Spread</div>
                        <div class="stat-value text-md font-mono bid-ask-spread">--</div>
                    </div>
                </div>
                <div class="card bg-base-200 shadow">
                    <div class="card-body p-4 flex-row items-center justify-between">
                        <label class="label cursor-pointer gap-2">
                            <span class="label-text text-xs">Lot Size</span>
                            <input type="checkbox" class="toggle toggle-sm toggle-primary lot-size-toggle" />
                        </label>
                        <label class="label cursor-pointer gap-2">
                            <span class="label-text text-xs">Pause</span>
                            <input type="checkbox" class="toggle toggle-sm toggle-secondary pause-toggle" />
                        </label>
                    </div>
                </div>
            </div>

            <!-- Imbalance Analysis -->
            <div class="card bg-base-100 shadow-xl mb-4">
                <div class="card-body p-4">
                    <h2 class="card-title text-lg">Order Book Imbalance Analysis</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="stat bg-base-200 rounded-box p-4">
                            <div class="stat-title text-xs">10 Level Imbalance</div>
                            <div class="stat-value text-xl imbalance-10-value">--</div>
                            <div class="stat-desc text-xs imbalance-10-interpretation">--</div>
                        </div>
                        <div class="stat bg-base-200 rounded-box p-4">
                            <div class="stat-title text-xs">20 Level Imbalance</div>
                            <div class="stat-value text-xl imbalance-20-value">--</div>
                            <div class="stat-desc text-xs imbalance-20-interpretation">--</div>
                        </div>
                        <div class="stat bg-base-200 rounded-box p-4">
                            <div class="stat-title text-xs">50 Level Imbalance</div>
                            <div class="stat-value text-xl imbalance-50-value">--</div>
                            <div class="stat-desc text-xs imbalance-50-interpretation">--</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DOM Display -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <h2 class="card-title text-lg">Depth of Market (DOM)</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h3 class="text-md font-bold mb-2 text-success">Bid Orders (Buy)</h3>
                            <div class="overflow-x-auto max-h-[600px]">
                                <table class="table table-sm w-full">
                                    <thead><tr><th>Price</th><th class="text-right">Qty</th><th class="text-center">Orders</th></tr></thead>
                                    <tbody class="bids text-success"></tbody>
                                </table>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-md font-bold mb-2 text-error">Ask Orders (Sell)</h3>
                            <div class="overflow-x-auto max-h-[600px]">
                                <table class="table table-sm w-full">
                                    <thead><tr><th>Price</th><th class="text-right">Qty</th><th class="text-center">Orders</th></tr></thead>
                                    <tbody class="asks text-error"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const socket = io();
            const instrumentTabs = document.getElementById('instrument-tabs');
            const instrumentTabContent = document.getElementById('instrument-tab-content');
            const template = document.getElementById('instrument-tab-template');
            const instrumentStates = {};

            const createTab = (instrument, index) => {
                const tabId = `tab-${instrument.symbol.replace(/[^a-zA-Z0-9]/g, '-')}`;

                const tabButton = document.createElement('a');
                tabButton.setAttribute('role', 'tab');
                tabButton.className = `tab ${index === 0 ? 'tab-active' : ''}`;
                tabButton.textContent = instrument.display_name || instrument.symbol;
                tabButton.dataset.symbol = instrument.symbol;
                instrumentTabs.appendChild(tabButton);

                const contentClone = template.content.cloneNode(true);
                const contentDiv = contentClone.querySelector('.tab-content');
                contentDiv.id = tabId;
                contentDiv.dataset.symbol = instrument.symbol;
                if (index === 0) contentDiv.classList.add('active');
                instrumentTabContent.appendChild(contentClone);

                instrumentStates[instrument.symbol] = {
                    lot_size: instrument.lot_size,
                    display_lot_size: false,
                    is_paused: false,
                    maxQuantity: { bid: 1, ask: 1 },
                    last_data: null,
                    contentElement: document.getElementById(tabId)
                };

                const newContent = instrumentStates[instrument.symbol].contentElement;
                newContent.querySelector('.lot-size-toggle').addEventListener('change', (e) => {
                    instrumentStates[instrument.symbol].display_lot_size = e.target.checked;
                    if (instrumentStates[instrument.symbol].last_data) {
                        renderInstrumentData(instrument.symbol, instrumentStates[instrument.symbol].last_data);
                    }
                });
                newContent.querySelector('.pause-toggle').addEventListener('change', (e) => {
                    instrumentStates[instrument.symbol].is_paused = e.target.checked;
                });
            };

            const formatQuantity = (qty, symbol) => {
                const state = instrumentStates[symbol];
                if (state.display_lot_size && state.lot_size > 0) {
                    const lots = Math.floor(qty / state.lot_size);
                    const remainder = qty % state.lot_size;
                    if (lots > 0 && remainder > 0) return `${lots}L + ${remainder}`;
                    if (lots > 0) return `${lots} lots`;
                }
                return qty.toLocaleString('en-IN');
            };

            const renderInstrumentData = (symbol, data) => {
                const state = instrumentStates[symbol];
                if (!state || state.is_paused) return;

                state.last_data = data;
                const content = state.contentElement;

                content.querySelector('.symbol-display').textContent = data.ticker;
                const bestBid = data.bids.length > 0 ? data.bids[0].price : 0;
                const bestAsk = data.asks.length > 0 ? data.asks[0].price : 0;
                content.querySelector('.last-price').textContent = ((bestBid + bestAsk) / 2).toFixed(2);
                content.querySelector('.bid-ask-spread').textContent = (bestAsk > bestBid) ? (bestAsk - bestBid).toFixed(2) : "0.00";

                const updateImbalance = (level) => {
                    const imb = data[`imbalance_${level}`];
                    const valEl = content.querySelector(`.imbalance-${level}-value`);
                    const intEl = content.querySelector(`.imbalance-${level}-interpretation`);
                    valEl.textContent = `${imb.imbalance_pct.toFixed(1)}%`;
                    intEl.textContent = imb.interpretation;
                    if (imb.imbalance_pct > 5) valEl.className = `stat-value text-success text-xl imbalance-${level}-value`;
                    else if (imb.imbalance_pct < -5) valEl.className = `stat-value text-error text-xl imbalance-${level}-value`;
                    else valEl.className = `stat-value text-warning text-xl imbalance-${level}-value`;
                };
                updateImbalance(10);
                updateImbalance(20);
                updateImbalance(50);
                
                state.maxQuantity.bid = Math.max(...data.bids.map(l => l.quantity), 1);
                state.maxQuantity.ask = Math.max(...data.asks.map(l => l.quantity), 1);

                const renderTable = (side, tableData) => {
                    const tbody = content.querySelector(`.${side}`);
                    tbody.innerHTML = '';
                    const maxQty = state.maxQuantity[side === 'bids' ? 'bid' : 'ask'];
                    tableData.slice(0, 50).forEach(level => {
                        const row = document.createElement('tr');
                        const depthPercent = (level.quantity / maxQty * 100);
                        row.innerHTML = `
                            <td><div class="depth-bar ${side === 'asks' ? 'ask-depth-bar' : ''}" style="width: ${depthPercent}%"></div>${level.price.toFixed(2)}</td>
                            <td class="text-right">${formatQuantity(level.quantity, symbol)}</td>
                            <td class="text-center">${level.orders}</td>
                        `;
                        tbody.appendChild(row);
                    });
                };
                renderTable('bids', data.bids);
                renderTable('asks', data.asks);
            };

            fetch('/api/instruments')
                .then(response => response.json())
                .then(instruments => {
                    instruments.forEach(createTab);

                    instrumentTabs.addEventListener('click', (e) => {
                        if (e.target.matches('.tab')) {
                            instrumentTabs.querySelectorAll('.tab').forEach(tab => tab.classList.remove('tab-active'));
                            instrumentTabContent.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                            e.target.classList.add('tab-active');
                            instrumentTabContent.querySelector(`.tab-content[data-symbol='${e.target.dataset.symbol}']`).classList.add('active');
                        }
                    });
                });

            socket.on('market_depth', (data) => {
                Object.keys(data).forEach(symbol => {
                    if (instrumentStates[symbol]) {
                        renderInstrumentData(symbol, data[symbol]);
                    }
                });
            });

            socket.on('connect', () => console.log('Connected to WebSocket'));
            socket.on('disconnect', () => console.log('Disconnected from WebSocket'));
        });
    </script>
</body>
</html>
